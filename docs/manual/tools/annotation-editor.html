<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>敬一书院 · 截图标注校准器</title><link rel="stylesheet" href="annotation-editor.css"></head>
<body><header class="top"><div><span class="eyebrow">JINGYI / ANNOTATION STUDIO</span><h1>截图标注校准器</h1><p>拖动标注框调整位置，拖动右下角调整大小；保存后资料库会同步更新。</p></div><a href="../index.html">返回操作资料库 ↗</a></header>
<div class="toolbar"><label>使用端与页面<select id="pageSelect"></select></label><button id="prev" type="button">← 上一页</button><button id="next" type="button">下一页 →</button><span id="sizeInfo"></span><button id="reset" type="button">恢复此页原始位置</button><button id="save" class="save" type="button">保存标注</button></div>
<main class="workspace"><section class="canvas-panel"><div class="panel-head"><div><strong id="pageTitle">正在加载</strong><small id="pageRoute"></small></div><div class="tips">鼠标拖动 · 右下角缩放 · 方向键微调 · Shift + 方向键加速</div></div><div class="image-scroll" id="imageScroll"><div class="image-stage" id="imageStage"><img id="screenImage" alt="用于校准的完整页面截图"></div></div></section><aside class="inspector"><div class="inspector-head"><span class="eyebrow">INSPECTOR</span><h2>标注与说明</h2><p>选中右侧卡片或截图上的框，再用下方数值精确调整。坐标按截图原始像素保存。</p></div><div id="cards"></div><div class="coordinates"><strong>精确位置</strong><div class="fields"><label>左边 X<input id="coordX" type="number" min="0"></label><label>顶部 Y<input id="coordY" type="number" min="0"></label><label>宽度 W<input id="coordW" type="number" min="4"></label><label>高度 H<input id="coordH" type="number" min="4"></label></div></div><p class="status" id="status" role="status" aria-live="polite">选择一个标注框开始校准。</p></aside></main>
<script src="../data.js"></script><script src="../pages.js"></script><script src="../annotation-layouts.js"></script><script src="annotation-editor.js"></script></body></html>
